# SecretSpec (https://secretspec.dev): declara os segredos de DESENVOLVIMENTO
# e CI deste repositório. Só declarações; nenhum valor fica aqui.
#
# Não substitui o sops-nix: segredos do sistema e do home-manager continuam
# no nix-secrets, decifrados na ativação. Aqui ficam apenas os que ferramentas
# rodadas à mão precisam (ex.: `secretspec run -- just check` ou o CI).
#
# Uso (o provedor fica na config pessoal: `secretspec config global init`):
#   secretspec check
#   secretspec run -- nix flake check
# O nome não é o de um repositório: é o prefixo das entradas no cofre
# (secretspec/<nome>/<perfil>/<CHAVE>), o mesmo em todas as configurações
# NixOS (nix-config-noctalia, nix-config-omarchy, ...).
[project]
name = "lbssousa-nixos"
revision = "1.0"

[profiles.default]
NIX_SECRETS_SSH_KEY = { description = "Deploy key (somente leitura) do repositório nix-secrets, usada pelo CI", required = false }
CACHIX_AUTH_TOKEN = { description = "Token do Cachix, se um cache próprio for usado para publicar builds", required = false }
GITHUB_TOKEN = { description = "Token do GitHub para evitar limite de taxa no `nix flake update`", required = false }

# ── Instalação a partir da live ISO (scripts/install.sh --age-keys-from-vault)
# Chaves age do sops-nix no Bitwarden (scripts/lib/vault.sh), pelo SecretSpec
# (provedor bw_note abaixo, sessão em BW_SESSION): notas seguras com títulos
# secretspec/lbssousa-nixos/install/<CHAVE>.
# Uma AGE_KEY_<LOGIN> por usuário com segredos no home-manager; o install.sh
# copia cada uma para ~/.config/sops/age/keys.txt do login correspondente.
#
# Migração (uma vez, com o nix-keys desbloqueado): `just store-age-keys`
# (scripts/store-age-keys.sh). Instalação: scripts/install-from-vault.sh
# (desbloqueio, conferência e install.sh).
[providers]
bw_note = "bw://?type=securenote&field=notes"

[profiles.install.defaults]
inherit = false
providers = ["bw_note"]

[profiles.install]
AGE_KEY_SYSTEM = { description = "Chave age do sistema (sops-nix) → /persist/etc/sops/age/keys.txt", required = true }
AGE_KEY_ABUTRE = { description = "Chave age pessoal do abutre (sops-nix do home-manager)", required = false }
