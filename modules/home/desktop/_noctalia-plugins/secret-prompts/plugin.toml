# Pinentry do GnuPG e SSH_ASKPASS desenhados pela shell. Os clientes
# noctalia-pinentry e noctalia-askpass (modules/packages/_noctalia-secret-prompts)
# falam o protocolo com o gpg-agent/ssh e mandam só os textos do pedido por
# `noctalia msg plugin`; a resposta volta num arquivo 0600 que o painel grava no
# diretório privado do cliente, em $XDG_RUNTIME_DIR/noctalia-secret-prompts/<id>.

id = "lbssousa/secret-prompts"
name = "Secret Prompts"
version = "1.0.0"
plugin_api = 42
author = "lbssousa"
license = "MIT"
tags = ["security", "utility"]
icon = "key"
description = "Answer gpg-agent (pinentry) and ssh/git (SSH_ASKPASS) prompts in a shell panel."

[[service]]
id = "service"
entry = "service.luau"

[[panel]]
id = "prompt"
entry = "panel.luau"
width = 440
height = "content"
max_height = 560
placement = "floating"
position = "center"
keyboard_focus = "exclusive"
dismiss_on_outside_click = false
